<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Outer Glow & Shadow -->
    <filter id="forge-shadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#FF4500" flood-opacity="0.32" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.25" />
    </filter>

    <!-- Background Rich Radial Gradient -->
    <radialGradient id="forge-bg" cx="78%" cy="18%" r="90%">
      <stop offset="0%" stop-color="#FFC400" />
      <stop offset="22%" stop-color="#FFA000" />
      <stop offset="52%" stop-color="#FF6200" />
      <stop offset="82%" stop-color="#FF3800" />
      <stop offset="100%" stop-color="#E52200" />
    </radialGradient>

    <!-- Top Gloss Highlight Gradient -->
    <linearGradient id="forge-gloss" x1="20%" y1="0%" x2="80%" y2="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.12" />
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Ambient Inner Soft Shadow Gradient on Left -->
    <linearGradient id="forge-ambient-dark" x1="0%" y1="40%" x2="60%" y2="80%">
      <stop offset="0%" stop-color="#D81B00" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#FF4500" stop-opacity="0" />
    </linearGradient>

    <!-- Flame Inner Gradient -->
    <linearGradient id="forge-flame-grad" x1="25%" y1="85%" x2="75%" y2="15%">
      <stop offset="0%" stop-color="#FFE814" />
      <stop offset="28%" stop-color="#FFD000" />
      <stop offset="60%" stop-color="#FFA000" />
      <stop offset="85%" stop-color="#FF6A00" />
      <stop offset="100%" stop-color="#FF4800" />
    </linearGradient>

    <!-- Inner Core Glowing Yellow Drop/Wave -->
    <radialGradient id="forge-flame-core" cx="36%" cy="72%" r="50%">
      <stop offset="0%" stop-color="#FFF966" stop-opacity="1" />
      <stop offset="45%" stop-color="#FFE100" stop-opacity="0.9" />
      <stop offset="80%" stop-color="#FFA800" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Squircle App Icon Container -->
  <g filter="url(#forge-shadow)">
    <rect x="40" y="40" width="432" height="432" rx="124" ry="124" fill="url(#forge-bg)" />
    
    <!-- Background Ambient Shadow Swirl (Left & Bottom) -->
    <path d="M 40 164 C 40 330, 110 472, 276 472 C 140 472, 40 372, 40 236 Z" fill="url(#forge-ambient-dark)" />
    
    <!-- Top-Right Glass Highlight Arc -->
    <path d="M 164 40 Q 400 40 472 164 Q 472 260 410 330 C 430 220 380 100 240 70 Z" fill="url(#forge-gloss)" />
  </g>

  <!-- Flame Glyph Group -->
  <g id="flame-glyph">
    <!-- Flame Solid Fill Background & Gradients -->
    <path
      d="M 256 366
         C 192 366, 162 318, 172 264
         C 178 232, 198 206, 218 190
         C 224 185, 230 192, 227 199
         C 219 220, 222 238, 236 248
         C 246 255, 256 250, 259 238
         C 268 200, 252 148, 274 132
         C 283 125, 291 133, 293 144
         C 303 194, 342 222, 348 274
         C 355 330, 318 366, 256 366 Z"
      fill="url(#forge-flame-grad)"
    />

    <!-- Inner Glowing Core Highlight (Lower-Left Bulb) -->
    <path
      d="M 256 366
         C 192 366, 162 318, 172 264
         C 178 232, 198 206, 218 190
         C 224 185, 230 192, 227 199
         C 219 220, 222 238, 236 248
         C 246 255, 256 250, 259 238
         C 263 222, 260 200, 262 182
         C 260 218, 240 260, 210 274
         C 192 282, 190 320, 232 348
         C 244 356, 254 362, 256 366 Z"
      fill="url(#forge-flame-core)"
    />

    <!-- Bold Dark Charcoal/Black Outline Stroke -->
    <path
      d="M 256 366
         C 192 366, 162 318, 172 264
         C 178 232, 198 206, 218 190
         C 224 185, 230 192, 227 199
         C 219 220, 222 238, 236 248
         C 246 255, 256 250, 259 238
         C 268 200, 252 148, 274 132
         C 283 125, 291 133, 293 144
         C 303 194, 342 222, 348 274
         C 355 330, 318 366, 256 366 Z"
      fill="none"
      stroke="#18181B"
      stroke-width="32"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
